# SonarQube Configuration
sonar.projectKey=datawise_datalab-frontend-v2
sonar.projectName=Datalab Frontend V2
sonar.projectVersion=1.0.0

# Source
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.react-router/**,**/coverage/**,**/*.config.*,**/*.d.ts

# Language & Encoding
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/components/ui/**,**/__mocks__/**,app/root.tsx,app/entry.*.tsx
